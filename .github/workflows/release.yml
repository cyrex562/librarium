name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Server binary — Linux (x86_64-unknown-linux-gnu) ───────────────────────
  server-linux:
    name: Server – Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: server-linux

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config libsqlite3-dev libsasl2-dev

      - name: Build server (release)
        run: cargo build --release -p librarium-server

      - name: Package .deb
        run: bash scripts/package-server-deb.sh "${{ github.ref_name }}"

      - name: Rename binary with version + platform suffix
        run: |
          cp target/release/librarium \
             dist/librarium-${{ github.ref_name }}-linux-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: server-linux
          path: |
            dist/librarium-${{ github.ref_name }}-linux-x86_64
            dist/librarium_*_amd64.deb

  # ── Server binary — Windows (x86_64-pc-windows-msvc) ──────────────────────
  server-windows:
    name: Server – Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: server-windows

      - name: Build server (release)
        run: cargo build --release -p librarium-server

      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\librarium.exe `
            dist\librarium-${{ github.ref_name }}-windows-x86_64.exe
          Copy-Item scripts\install-service-windows.ps1 dist\

      - uses: actions/upload-artifact@v4
        with:
          name: server-windows
          path: |
            dist/librarium-${{ github.ref_name }}-windows-x86_64.exe
            dist/install-service-windows.ps1

  # ── Desktop (Tauri) — Linux (AppImage + .deb) ─────────────────────────────
  desktop-linux:
    name: Desktop – Linux (AppImage + deb)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-linux

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            libsqlite3-dev \
            libsasl2-dev \
            patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      - name: Build desktop bundles (AppImage + deb)
        working-directory: crates/librarium-tauri
        run: cargo tauri build --bundles appimage,deb

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp target/release/bundle/appimage/*.AppImage \
             dist/Librarium-${{ github.ref_name }}-linux-x86_64.AppImage
          cp target/release/bundle/deb/*.deb \
             dist/Librarium-${{ github.ref_name }}-linux-x86_64.deb

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            dist/Librarium-${{ github.ref_name }}-linux-x86_64.AppImage
            dist/Librarium-${{ github.ref_name }}-linux-x86_64.deb

  # ── Desktop (Tauri) — Windows (NSIS installer) ────────────────────────────
  desktop-windows:
    name: Desktop – Windows (NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-windows

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      - name: Build desktop bundle (NSIS)
        working-directory: crates/librarium-tauri
        run: cargo tauri build --bundles nsis

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $src = Get-ChildItem -Path target\release\bundle\nsis\*.exe | Select-Object -First 1
          Copy-Item $src.FullName `
            dist\Librarium-${{ github.ref_name }}-windows-x86_64-setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: dist/Librarium-${{ github.ref_name }}-windows-x86_64-setup.exe

  # ── Mobile (Tauri) — Android (signed release APK) ─────────────────────────
  # Skips entirely when the signing secrets aren't set (a fork, or before a
  # real keystore has been generated — see AGENTS.md's "Android release
  # signing" section) rather than failing the whole release pipeline.
  # GitHub Actions does NOT expose the `secrets` context to a job-level `if:`
  # (only github/needs/vars/inputs). Referencing it there makes the whole
  # workflow file invalid, so every push failed in ~0s with "workflow file
  # issue" and no release could ever be built. This gate reads the secret in a
  # step — where `secrets` IS available — and publishes the answer as an
  # output, which the `android` job can legally consult via `needs`.
  signing-check:
    name: Check Android signing configuration
    runs-on: ubuntu-latest
    outputs:
      android_signing: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANDROID_KEYSTORE_BASE64 is not set — skipping the Android APK. Desktop and server artifacts are unaffected."
          fi

  android:
    name: Mobile – Android (signed release APK)
    runs-on: ubuntu-latest
    needs: signing-check
    if: needs.signing-check.outputs.android_signing == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-release

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # Relies on the Android SDK/NDK already bundled on GitHub's
      # `ubuntu-latest` runner image (same as the `android-cross-compile`
      # CI gate) — just need to point ANDROID_NDK_HOME at the installed
      # version, since (unlike cargo-ndk) `cargo tauri android build`
      # doesn't auto-detect it.
      - name: Resolve ANDROID_NDK_HOME
        run: |
          ndk_version=$(ls "$ANDROID_HOME/ndk" | sort -V | tail -1)
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk_version" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      # Reconstructed from repo secrets, never committed — see
      # gen/android/.gitignore and AGENTS.md's "Android release signing"
      # section for the keystore.properties shape this file expects.
      - name: Reconstruct release keystore
        working-directory: crates/librarium-tauri/gen/android
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.jks
          cat > keystore.properties <<EOF
          storeFile=release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build signed release APK
        working-directory: crates/librarium-tauri
        run: cargo tauri android build --apk -t aarch64

      - name: Stage artifact
        run: |
          mkdir -p dist
          cp crates/librarium-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk \
             dist/Librarium-${{ github.ref_name }}-android-universal.apk

      - name: Remove keystore from the runner
        if: always()
        run: rm -f crates/librarium-tauri/gen/android/release.jks crates/librarium-tauri/gen/android/keystore.properties

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/Librarium-${{ github.ref_name }}-android-universal.apk

  # ── Server — Windows portable zip ─────────────────────────────────────────
  server-windows-portable:
    name: Server – Windows portable (zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: server-windows-portable

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build portable server package
        shell: pwsh
        run: pwsh scripts/build-portable.ps1 -OutDir dist/portable

      - name: Zip portable package
        shell: pwsh
        run: |
          Compress-Archive -Path dist/portable/* `
            -DestinationPath dist/Librarium-${{ github.ref_name }}-windows-x86_64-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: server-windows-portable
          path: dist/Librarium-${{ github.ref_name }}-windows-x86_64-portable.zip

  # ── Desktop — Windows portable zip ────────────────────────────────────────
  desktop-windows-portable:
    name: Desktop – Windows portable (zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-windows-portable

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build portable desktop package
        shell: pwsh
        run: pwsh scripts/build-portable-desktop.ps1 -OutDir dist/portable-desktop

      - name: Zip portable package
        shell: pwsh
        run: |
          Compress-Archive -Path dist/portable-desktop/* `
            -DestinationPath dist/Librarium-${{ github.ref_name }}-windows-x86_64-desktop-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-portable
          path: dist/Librarium-${{ github.ref_name }}-windows-x86_64-desktop-portable.zip

  # ── GitHub Release — publish all artifacts ────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [server-linux, server-windows, desktop-linux, desktop-windows, server-windows-portable, desktop-windows-portable, android]
    # `android` is conditionally skipped (no signing secrets configured yet
    # — see that job's `if`), which must not skip this job too: default
    # `needs` semantics treat "any needed job skipped" the same as failed.
    # Run unless something actually failed or was cancelled.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact tree
        run: |
          mkdir -p release-assets
          find artifacts -type f | xargs -I{} cp {} release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
