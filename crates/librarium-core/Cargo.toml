[package]
name = "librarium-core"
version = "0.102.2"
edition = "2021"

[dependencies]
librarium-types = { path = "../librarium-types" }
serde = { version = "1.0", features = ["derive"] }
# preserve_order: see librarium-server/Cargo.toml — frontmatter round-trips
# depend on it to avoid silently reordering the user's YAML keys.
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
regex = "1.11"
zip = "2.2"
walkdir = "2.5"
sha2 = "0.10"
pulldown-cmark = "0.12"
# Syntax highlighting for rendered code blocks. `default-fancy` swaps the
# default regex backend (`onig`, wrapping the C library Oniguruma) for the
# pure-Rust `fancy-regex` — `onig`/`onig_sys` was the other of the two
# C-toolchain dependencies blocking an Android cross-compile of this crate
# (LIB Route-C-04; the other was `ldap3`'s default TLS backend, fixed in
# librarium-server's Cargo.toml). Same syntax/theme set contents as before,
# just a different regex engine underneath.
syntect = { version = "5.2", default-features = false, features = [
    "default-fancy",
] }

# Optional integrations. actix and sqlx are not in the default feature set:
# this crate is meant to be usable from a mobile client with no actix/sqlx/
# tokio in its dependency tree. `librarium-server` enables both below.
actix-web = { version = "4.9", optional = true }
sqlx = { version = "0.8", optional = true, features = [
    "runtime-tokio-rustls",
    "sqlite",
] }
# Tantivy full-text search. Optional (and default-on, see `search` below) so a
# consumer that wants to opt out of Tantivy entirely can with
# `--no-default-features`.
tantivy = { version = "0.22", optional = true, default-features = false, features = [
    "mmap",
] }
rayon = { version = "1.11.0", optional = true }
rand = { version = "0.9.2", optional = true }

[features]
default = ["search"]
# AppError::error_response(): actix-web's ResponseError trait is foreign to
# this crate, so librarium-server (which depends on both actix-web and this
# crate) cannot provide the impl itself (orphan rule). Providing it here,
# behind a feature, is the standard workaround.
actix = ["dep:actix-web"]
# AppError::DatabaseError and its constructors, gated so a consumer with no
# database layer (e.g. a thin mobile client) doesn't pull in sqlx (and,
# transitively, tokio) just to use AppError for filesystem errors.
sqlx = ["dep:sqlx"]
# search_service (Tantivy-backed SearchIndex). Default-on since every current
# consumer wants it; disable with `--no-default-features` to drop Tantivy
# from the dependency tree entirely.
search = ["dep:tantivy", "dep:rayon", "dep:rand"]

[dev-dependencies]
tempfile = "3.14"
