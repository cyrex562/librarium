[package]
name = "librarium-mobile"
version = "0.102.2"
edition = "2021"
description = "Local (no embedded-server) command layer for the Librarium Tauri mobile shell"

[lib]
name = "librarium_mobile"
path = "src/lib.rs"

[dependencies]
librarium-core = { path = "../librarium-core", features = ["sqlx"] }
librarium-types = { path = "../librarium-types" }
# The sync engine itself (already cross-compiles to Android — see the CI
# android-cross-compile job); this crate only adds a thin local bridge that
# resolves vault ids to paths via `vaults.json` instead of `librarium.db`.
librarium-sync = { path = "../librarium-sync" }
# Used directly (not just transitively via librarium-sync) to validate a
# pairing's base URL/API key with a cheap authenticated call before saving it.
librarium-client = { path = "../librarium-client" }
anyhow = "1.0"
# Platform secure storage for the paired remote's API key: the `v1` default
# feature covers desktop (Keychain/Credential Manager/Secret Service) for
# local dev and tests; `android-native-keyring-store` is enabled for the
# real Android Keystore-backed store — keyring's own Cargo.toml gates that
# dependency to the Android target already, so enabling the feature has no
# effect on other targets. Note: unlike desktop, Android has no automatic
# default-store detection (see keyring::Entry's v1 docs) — the app host must
# call `keyring_core::set_default_store(android_native_keyring_store::Store::new(...)?)`
# once at startup (from a live JNI context) before any pairing_* command
# runs; that registration is app-bootstrap work, out of scope for this crate
# (see commands.rs's module doc for the broader "no app wiring yet" boundary).
keyring = { version = "4", features = ["android-native-keyring-store"] }
tauri = { version = "2", default-features = false }
serde = { version = "1.0", features = ["derive"] }
# preserve_order: see librarium-core/Cargo.toml — keeps ad-hoc response object
# keys in declaration order rather than sorted, matching the REST endpoints'
# `serde_json::json!({...})` responses this crate mirrors.
serde_json = { version = "1.0", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.5"
regex = "1.11"
uuid = { version = "1.11", features = ["v4"] }
# Local metadata store (preferences/recent/favorites/bookmarks) in its own
# mobile.db — same stack librarium-sync already uses for sync.db. Bundled
# SQLite (sqlx-sqlite's default for the "sqlite" feature) compiles from
# vendored C source via the target C compiler, so this cross-compiles to
# Android the same way librarium-sync already does — no system SQLite needed.
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }
# Wraps every blocking FileService/std::fs call in spawn_blocking so a slow
# disk operation never stalls the Tauri IPC executor.
tokio = { version = "1.42", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1.42", features = ["rt", "macros"] }
tempfile = "3.14"
# Only pulled in for the `sync_e2e` integration test, which spins up a real
# in-process librarium-server as the "remote" to validate the sync bridge
# against actual HTTP + WebSocket traffic (issue #53's acceptance criteria).
# Not part of the shipped mobile binary — dev-dependencies aren't included in
# `cargo ndk build`, so this has no effect on the Android cross-compile job.
librarium-server = { path = "../librarium-server" }
actix-web = { version = "4.9", features = ["rustls-0_23"] }
actix-test = "0.1"
argon2 = "0.5"
# Only for contract_test.rs (#59): favorites/bookmarks have no ObsidianClient
# methods, so those six routes are driven with plain authenticated requests.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
