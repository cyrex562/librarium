[package]
name = "librarium-sync"
version = "0.102.15"
edition = "2021"

[dependencies]
librarium-client = { path = "../librarium-client" }
librarium-types = { path = "../librarium-types" }
tokio = { version = "1.42", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "fs"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }
notify = "7.0"
notify-debouncer-full = "0.4"
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
thiserror = "2.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4"] }
walkdir = "2.5"

[dev-dependencies]
tokio = { version = "1.42", features = ["full"] }
tempfile = "3"
